name: Manual MACD Run

on:
  workflow_dispatch:

jobs:
  run-macd:
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ vars.SUPABASE_KEY || secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install automation dependencies
        working-directory: automation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run MACD script
        working-directory: ${{ github.workspace }}
        run: |
          python automation/strategies/MACD.py
