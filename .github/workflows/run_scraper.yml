name: Run Groww Scraper

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  schedule:
    - cron: '0 5 * * 1-5' # Runs daily at 5:00 AM UTC (Monday to Friday)

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-seleniumlibrary pandas python-dotenv openpyxl

      - name: Execute Scraper script
        env:
          GROWW_EMAIL: ${{ secrets.GROWW_EMAIL }}
          GROWW_PASSWORD: ${{ secrets.GROWW_PASSWORD }}
          GROWW_PIN: ${{ secrets.GROWW_PIN }}
        run: |
          python automation/scraper/Run.py

      - name: Upload Scraped Reports and Screenshots
        if: always() # Uploads output even if the run fails so you can debug via screenshots
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output-artifacts
          path: |
            automation/scraper/reports/
            automation/scraper/results/