name: Job Runner
on:
    workflow_dispatch: 

jobs:
    run-job:
        runs-on: ubuntu-latest
        environment: production

        env:
            SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
            SUPABASE_KEY: ${{ vars.SUPABASE_KEY || secrets.SUPABASE_KEY }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Prepare automation job
              run: |
                  mkdir -p .job-runner
                  cp automation/pyproject.toml .job-runner/
                  cp -r automation/shared automation/jobs automation/strategies .job-runner/

            - name: Install automation dependencies
              working-directory: .job-runner
              run: |
                  python -m pip install --upgrade pip
                  python - <<'PY'
                  import subprocess
                  import sys
                  import tomllib

                  with open("pyproject.toml", "rb") as project_file:
                      dependencies = tomllib.load(project_file)["project"]["dependencies"]

                  subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies])
                  PY

            - name: Run Historic Data Loader
              working-directory: .job-runner/jobs
              run: |
                  python HistoricDataLoder.py

            - name: Run Strategies Runner
              working-directory: .job-runner
              run: |
                  python strategies/Runner.py